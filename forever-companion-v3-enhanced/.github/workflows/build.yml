name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x forever-companion-v3-enhanced/android-native/gradlew

      - name: Build Debug APK
        run: |
          cd forever-companion-v3-enhanced/android-native
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ForeverCompanion-debug
          path: forever-companion-v3-enhanced/android-native/app/build/outputs/apk/debug/*.apk
