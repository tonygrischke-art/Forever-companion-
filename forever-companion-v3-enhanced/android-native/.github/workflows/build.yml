name: Build Forever Companion

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - uses: android-actions/setup-android@v3
    
    - name: Setup SDK
      run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
      working-directory: ./android-native
      
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
      working-directory: ./android-native
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: forever-companion-debug
        path: android-native/app/build/outputs/apk/debug/app-debug.apk
